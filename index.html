<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>২৯ কার্ড গেম (29 Card Game Fixed)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #0d2b1d; color: #fff; overflow-x: hidden; }
        .felt-table {
            background: radial-gradient(circle, #1a5c38 0%, #0d2b1d 100%);
            box-shadow: inset 0 0 80px rgba(0,0,0,0.8);
        }
        .card { transition: all 0.2s ease-in-out; user-select: none; }
        .card:hover { transform: translateY(-10px); }
        .active-turn { border: 2px solid #facc15 !important; box-shadow: 0 0 15px rgba(250, 204, 21, 0.6); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between select-none">
    
    <header class="bg-black/40 backdrop-blur-md px-6 py-3 flex justify-between items-center border-b border-green-800">
        <h1 class="text-xl font-bold text-yellow-400 flex items-center gap-2">🎴 ২৯ কার্ড গেম (Live Online)</h1>
        <div id="room-badge" class="hidden bg-green-900/80 px-4 py-1.5 rounded-full text-sm font-semibold border border-green-600 shadow">
            রুম কোড: <span id="current-room-code" class="text-yellow-300 font-mono tracking-widest">------</span>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-4 relative">
        
        <!-- LOBBY SCREEN -->
        <div id="lobby-screen" class="w-full max-w-md bg-green-950/90 border border-green-700 p-8 rounded-3xl shadow-2xl backdrop-blur-md">
            <h2 class="text-2xl font-bold text-center text-yellow-400 mb-6">অনলাইন রুম তৈরি বা জয়েন করুন</h2>
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold mb-2 text-green-200">আপনার নাম:</label>
                    <input type="text" id="player-name" placeholder="নাম লিখুন..." class="w-full px-4 py-3 rounded-xl bg-black/50 border border-green-600 focus:outline-none focus:border-yellow-400 text-white font-medium">
                </div>
                <button onclick="createRoom()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3.5 rounded-xl shadow-lg transition transform active:scale-95">
                    নতুন রুম তৈরি করুন (Create Room)
                </button>
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-green-800"></div>
                    <span class="flex-shrink mx-4 text-gray-400 text-sm">অথবা</span>
                    <div class="flex-grow border-t border-green-800"></div>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="join-room-code" placeholder="রুম কোড দিন..." class="flex-1 px-4 py-3 rounded-xl bg-black/50 border border-green-600 uppercase focus:outline-none focus:border-yellow-400 text-white font-mono tracking-wider">
                    <button onclick="joinRoom()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-3 rounded-xl shadow-lg transition">
                        জয়েন
                    </button>
                </div>
            </div>
        </div>

        <!-- WAITING ROOM -->
        <div id="waiting-room" class="hidden w-full max-w-lg bg-green-950/90 border border-green-700 p-8 rounded-3xl shadow-2xl text-center backdrop-blur-md">
            <h2 class="text-2xl font-bold text-yellow-400 mb-2">খেলোয়াড়দের জন্য অপেক্ষা করা হচ্ছে...</h2>
            <p class="text-gray-300 text-sm mb-4">কোডটি বন্ধুদের দিন (৪ জন পূর্ণ হলে শুরু করুন):</p>
            <div class="bg-black/60 p-4 rounded-2xl border border-yellow-500/50 mb-6 inline-block shadow-inner">
                <span id="display-room-code" class="text-4xl font-mono font-bold tracking-widest text-yellow-300">------</span>
            </div>
            <div id="players-list" class="space-y-2 mb-6 text-left bg-black/40 p-4 rounded-xl border border-green-800 text-sm min-h-[100px]"></div>
            <button id="start-btn" onclick="startGame()" class="hidden w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition">
                কার্ড শাফেল ও গেম শুরু করুন (Start Game)
            </button>
        </div>

        <!-- GAME TABLE -->
        <div id="game-table" class="hidden w-full max-w-6xl h-[740px] felt-table rounded-3xl border-4 border-green-900 relative flex flex-col justify-between p-6 overflow-hidden shadow-2xl">
            
            <!-- Scores Header -->
            <div class="flex justify-between items-center bg-black/40 px-6 py-2 rounded-2xl border border-green-800">
                <div class="text-sm text-yellow-300 font-semibold">টিম ১ স্কোর: <span id="team1-score">0</span></div>
                <div id="game-status" class="text-yellow-400 font-bold text-center tracking-wide">বিড ডিক্লেয়ার করুন</div>
                <div class="text-sm text-yellow-300 font-semibold">টিম ২ স্কোর: <span id="team2-score">0</span></div>
            </div>

            <!-- Middle Field -->
            <div class="flex justify-between items-center px-12">
                <div id="seat-1" class="flex flex-col items-center p-3 rounded-xl bg-black/40 border border-green-800">
                    <span id="name-1" class="text-xs text-yellow-300 font-bold mb-1">প্লেয়ার ২</span>
                </div>

                <div class="flex flex-col items-center justify-center bg-black/40 p-6 rounded-3xl border border-green-700/60 min-w-[360px] shadow-2xl backdrop-blur-sm">
                    <div id="trick-area" class="flex gap-3 h-32 items-center justify-center mb-3 min-w-[220px]"></div>
                    
                    <div id="action-panel" class="w-full flex flex-col items-center gap-2">
                        <div class="text-xs text-green-300 mb-1 font-semibold">বিড পয়েন্ট সিলেক্ট করুন:</div>
                        <div class="grid grid-cols-4 gap-2 mb-2 w-full">
                            <button onclick="makeBid(16)" class="bg-green-800 hover:bg-green-700 text-white font-bold py-1.5 rounded text-sm">১৬</button>
                            <button onclick="makeBid(18)" class="bg-green-800 hover:bg-green-700 text-white font-bold py-1.5 rounded text-sm">১৮</button>
                            <button onclick="makeBid(20)" class="bg-green-800 hover:bg-green-700 text-white font-bold py-1.5 rounded text-sm">২০</button>
                            <button onclick="makeBid(22)" class="bg-green-800 hover:bg-green-700 text-white font-bold py-1.5 rounded text-sm">২২</button>
                        </div>
                        <button onclick="passBid()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-2 rounded-xl shadow transition">পাস (Pass)</button>
                    </div>
                </div>

                <div id="seat-3" class="flex flex-col items-center p-3 rounded-xl bg-black/40 border border-green-800">
                    <span id="name-3" class="text-xs text-yellow-300 font-bold mb-1">প্লেয়ার ৪</span>
                </div>
            </div>

            <!-- Current User Hand & Seat 2 (Partner) -->
            <div class="flex flex-col items-center gap-2">
                <div id="seat-2" class="flex flex-col items-center p-2 rounded-xl bg-black/40 border border-green-800">
                    <span id="name-2" class="text-xs text-yellow-300 font-bold">পার্টনার</span>
                </div>
                <div class="flex gap-2 mb-1" id="my-hand"></div>
                <div class="text-sm font-semibold text-green-200" id="my-name-label">আপনার হাত</div>
            </div>

        </div>

    </main>

    <script>
        const firebaseConfig = {
            databaseURL: "https://cards29-game-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myName = "", currentRoom = "", isHost = false;
        let myCards = [], myPlayerIndex = -1;
        let currentTurn = 0, gameState = 'bidding';
        let playersList = [];

        const rankValues = { 'J': 3, '9': 2, 'A': 1, '10': 1, 'K': 0, 'Q': 0, '8': 0, '7': 0 };

        function playSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {}
        }

        function createRoom() {
            myName = document.getElementById('player-name').value.trim();
            if(!myName) { alert("নাম লিখুন!"); return; }
            currentRoom = Math.random().toString(36).substring(2, 7).toUpperCase();
            isHost = true;
            myPlayerIndex = 0;

            localStorage.setItem('card29_myname', myName);
            localStorage.setItem('card29_index', '0');

            db.ref('rooms/' + currentRoom).set({
                status: 'waiting',
                players: [{ name: myName, isHost: true }],
                currentTurn: 0,
                gameState: 'bidding',
                highestBid: 0,
                highestBidder: '',
                tableCards: [],
                team1Score: 0,
                team2Score: 0
            });

            listenToRoom();
            showWaitingRoom();
        }

        function joinRoom() {
            myName = document.getElementById('player-name').value.trim();
            let code = document.getElementById('join-room-code').value.trim().toUpperCase();
            if(!myName || !code) { alert("নাম এবং কোড দিন!"); return; }
            currentRoom = code;

            db.ref('rooms/' + currentRoom).once('value', snapshot => {
                if(!snapshot.exists()) { alert("রুম পাওয়া যায়নি!"); return; }
                let room = snapshot.val();
                let players = room.players || [];
                if(players.length >= 4) { alert("রুম ফুল হয়ে গেছে!"); return; }

                myPlayerIndex = players.length;
                localStorage.setItem('card29_myname', myName);
                localStorage.setItem('card29_index', myPlayerIndex.toString());

                players.push({ name: myName, isHost: false });
                db.ref('rooms/' + currentRoom + '/players').set(players);
                
                listenToRoom();
                showWaitingRoom();
            });
        }

        function showWaitingRoom() {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('waiting-room').classList.remove('hidden');
            document.getElementById('room-badge').classList.remove('hidden');
            document.getElementById('display-room-code').innerText = currentRoom;
            document.getElementById('current-room-code').innerText = currentRoom;
        }

        function listenToRoom() {
            if(myPlayerIndex === -1 && localStorage.getItem('card29_index') !== null) {
                myPlayerIndex = parseInt(localStorage.getItem('card29_index'));
            }

            db.ref('rooms/' + currentRoom).on('value', snapshot => {
                if(!snapshot.exists()) return;
                let room = snapshot.val();
                playersList = room.players || [];
                currentTurn = room.currentTurn !== undefined ? room.currentTurn : 0;
                gameState = room.gameState || 'bidding';

                let html = '<div class="text-gray-400 font-semibold mb-2">যুক্ত হওয়া প্লেয়ারসমূহ:</div>';
                playersList.forEach((p, idx) => {
                    html += `<div class="text-green-300 font-bold py-1">👤 ${p.name} (Seat ${idx+1}) ${p.isHost ? '[হোস্ট]' : ''}</div>`;
                });
                document.getElementById('players-list').innerHTML = html;

                if(isHost && playersList.length >= 4) {
                    document.getElementById('start-btn').classList.remove('hidden');
                }

                if(room.status === 'playing') {
                    document.getElementById('waiting-room').classList.add('hidden');
                    document.getElementById('game-table').classList.remove('hidden');
                    
                    if(room.hands && room.hands[myPlayerIndex]) {
                        myCards = room.hands[myPlayerIndex];
                        renderMyHand();
                    }

                    updatePlayerSeatsAndTurns(playersList, currentTurn);

                    document.getElementById('team1-score').innerText = room.team1Score || 0;
                    document.getElementById('team2-score').innerText = room.team2Score || 0;

                    if (gameState === 'bidding') {
                        document.getElementById('trick-area').innerHTML = ''; // Keep clean during bidding
                        document.getElementById('action-panel').style.display = 'flex';
                        if(currentTurn === myPlayerIndex) {
                            document.getElementById('game-status').innerText = `আপনার বিড করার পালা! সর্বোচ্চ বিড: ${room.highestBid || 0}`;
                        } else {
                            let activeName = playersList[currentTurn] ? playersList[currentTurn].name : 'কেউ একজন';
                            document.getElementById('game-status').innerText = `${activeName} বিড করছেন... (সর্বোচ্চ: ${room.highestBid || 0})`;
                        }
                    } else if (gameState === 'playing') {
                        document.getElementById('action-panel').style.display = 'none';
                        renderTableCards(room.tableCards || []);
                        if(currentTurn === myPlayerIndex) {
                            document.getElementById('game-status').innerText = `আপনার চাল! একটি কার্ড খেলুন।`;
                        } else {
                            let activeName = playersList[currentTurn] ? playersList[currentTurn].name : 'অন্য প্লেয়ার';
                            document.getElementById('game-status').innerText = `${activeName}-এর চাল চলছে...`;
                        }
                    }
                }
            });
        }

        function updatePlayerSeatsAndTurns(players, turnIdx) {
            let s1Idx = (myPlayerIndex + 1) % 4;
            let s2Idx = (myPlayerIndex + 2) % 4;
            let s3Idx = (myPlayerIndex + 3) % 4;

            document.getElementById('name-1').innerText = players[s1Idx] ? players[s1Idx].name : 'বিরোধী ১';
            document.getElementById('name-2').innerText = players[s2Idx] ? players[s2Idx].name : 'পার্টনার';
            document.getElementById('name-3').innerText = players[s3Idx] ? players[s3Idx].name : 'বিরোধী ২';

            ['seat-1', 'seat-2', 'seat-3'].forEach(id => document.getElementById(id).classList.remove('active-turn'));
            document.getElementById('my-name-label').classList.remove('text-yellow-400', 'font-bold');

            if (turnIdx === s1Idx) document.getElementById('seat-1').classList.add('active-turn');
            else if (turnIdx === s2Idx) document.getElementById('seat-2').classList.add('active-turn');
            else if (turnIdx === s3Idx) document.getElementById('seat-3').classList.add('active-turn');
            else if (turnIdx === myPlayerIndex) {
                document.getElementById('my-name-label').classList.add('text-yellow-400', 'font-bold');
            }
        }

        function startGame() {
            const suits = ['♠', '♥', '♦', '♣'];
            const ranks = ['J', '9', 'A', '10', 'K', 'Q', '8', '7'];
            let deck = [];
            suits.forEach(s => ranks.forEach(r => deck.push({ suit: s, rank: r, color: (s === '♥' || s === '♦') ? 'text-red-500' : 'text-black' })));
            deck.sort(() => Math.random() - 0.5);

            let hands = [
                deck.slice(0, 8),
                deck.slice(8, 16),
                deck.slice(16, 24),
                deck.slice(24, 32)
            ];

            db.ref('rooms/' + currentRoom).update({
                status: 'playing',
                hands: hands,
                currentTurn: 0,
                gameState: 'bidding',
                highestBid: 0,
                highestBidder: '',
                passCount: 0,
                tableCards: []
            });
        }

        function makeBid(val) {
            if (currentTurn !== myPlayerIndex) { alert("এখন আপনার পালা নয়!"); return; }
            playSound();
            db.ref('rooms/' + currentRoom).once('value', snapshot => {
                let room = snapshot.val();
                let currentHighest = room.highestBid || 0;

                if (val <= currentHighest) {
                    alert("বর্তমান সর্বোচ্চ বিডের চেয়ে বেশি বিড করুন!");
                    return;
                }

                let nextTurn = (currentTurn + 1) % 4;
                db.ref('rooms/' + currentRoom).update({
                    highestBid: val,
                    highestBidder: myName,
                    currentTurn: nextTurn
                });
            });
        }

        function passBid() {
            if (currentTurn !== myPlayerIndex) { alert("এখন আপনার পালা নয়!"); return; }
            playSound();
            db.ref('rooms/' + currentRoom).once('value', snapshot => {
                let room = snapshot.val();
                let nextTurn = (currentTurn + 1) % 4;
                let passCount = (room.passCount || 0) + 1;
                
                let updates = { currentTurn: nextTurn, passCount: passCount };
                if (passCount >= 3 && (room.highestBid || 0) > 0) {
                    updates.gameState = 'playing';
                    updates.currentTurn = 0;
                }

                db.ref('rooms/' + currentRoom).update(updates);
            });
        }

        function renderMyHand() {
            const myHandEl = document.getElementById('my-hand');
            myHandEl.innerHTML = '';
            myCards.forEach((c, idx) => {
                let cardDiv = document.createElement('div');
                cardDiv.className = `card bg-white w-16 h-24 rounded-lg shadow-2xl flex flex-col justify-between p-2 cursor-pointer border ${c.color} font-bold`;
                cardDiv.innerHTML = `<span class="text-sm">${c.rank}</span><span class="text-xl self-center">${c.suit}</span><span class="text-sm self-end rotate-180">${c.rank}</span>`;
                
                cardDiv.onclick = () => {
                    if (gameState !== 'playing') {
                        alert("এখনও বিডিং চলছে!");
                        return;
                    }
                    if (currentTurn !== myPlayerIndex) {
                        alert("এখন আপনার চাল নয়!");
                        return;
                    }

                    db.ref('rooms/' + currentRoom).once('value', snapshot => {
                        let room = snapshot.val();
                        let tableCards = room.tableCards || [];
                        if (tableCards.length > 0) {
                            let leadSuit = tableCards[0].card.suit;
                            let hasLeadSuit = myCards.some(card => card.suit === leadSuit);
                            if (hasLeadSuit && c.suit !== leadSuit) {
                                alert(`নিয়ম অনুযায়ী আপনাকে অবশ্যই '${leadSuit}' সুটের কার্ড খেলতে হবে!`);
                                return;
                            }
                        }
                        playCard(idx, c);
                    });
                };
                myHandEl.appendChild(cardDiv);
            });
        }

        function playCard(cardIndex, card) {
            playSound();
            myCards.splice(cardIndex, 1);
            renderMyHand();

            db.ref('rooms/' + currentRoom).once('value', snapshot => {
                let room = snapshot.val();
                let tableCards = room.tableCards || [];
                let currentName = localStorage.getItem('card29_myname') || 'Player';
                tableCards.push({ playerIndex: myPlayerIndex, playerName: currentName, card: card });

                let updates = { tableCards: tableCards };

                if (tableCards.length === 4) {
                    let leadSuit = tableCards[0].card.suit;
                    let winningCard = tableCards[0];
                    let trickPoints = 0;

                    tableCards.forEach(tc => {
                        trickPoints += (rankValues[tc.card.rank] || 0);
                        if (tc.card.suit === leadSuit) {
                            if (rankValues[tc.card.rank] > (rankValues[winningCard.card.rank] || 0)) {
                                winningCard = tc;
                            }
                        }
                    });

                    let winnerIdx = winningCard.playerIndex;
                    let isTeam1Winner = (winnerIdx === 0 || winnerIdx === 2);

                    let t1Score = room.team1Score || 0;
                    let t2Score = room.team2Score || 0;
                    if (isTeam1Winner) t1Score += trickPoints;
                    else t2Score += trickPoints;

                    updates.team1Score = t1Score;
                    updates.team2Score = t2Score;
                    updates.currentTurn = winnerIdx;

                    setTimeout(() => {
                        db.ref('rooms/' + currentRoom + '/tableCards').set([]);
                    }, 3500);
                } else {
                    updates.currentTurn = (currentTurn + 1) % 4;
                }

                db.ref('rooms/' + currentRoom).update(updates);
            });
        }

        function renderTableCards(tableCards) {
            const trickArea = document.getElementById('trick-area');
            trickArea.innerHTML = '';
            tableCards.forEach(tc => {
                let c = tc.card;
                if(!c) return;
                let d = document.createElement('div');
                d.className = `card bg-white w-16 h-24 rounded-lg shadow-xl flex flex-col justify-between p-2 border ${c.color} font-bold relative`;
                d.innerHTML = `<span class="text-sm">${c.rank}</span><span class="text-xl self-center">${c.suit}</span><span class="text-sm self-end rotate-180">${c.rank}</span><span class="absolute bottom-1 right-1 text-[9px] bg-black/70 text-yellow-300 px-1 rounded">${tc.playerName || ''}</span>`;
                trickArea.appendChild(d);
            });
        }
    </script>
</body>
</html>
