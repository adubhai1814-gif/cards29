<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>২৯ কার্ড গেম (29 Card Game Online)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase Standard Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #0d2b1d; color: #fff; overflow: hidden; }
        .felt-table {
            background: radial-gradient(circle, #1a5c38 0%, #0d2b1d 100%);
            box-shadow: inset 0 0 80px rgba(0,0,0,0.8);
        }
        .card { transition: all 0.2s ease-in-out; user-select: none; }
        .card:hover { transform: translateY(-10px); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between select-none">
    
    <!-- Top Header -->
    <header class="bg-black/40 backdrop-blur-md px-6 py-3 flex justify-between items-center border-b border-green-800">
        <h1 class="text-xl font-bold text-yellow-400 flex items-center gap-2">🎴 ২৯ কার্ড গেম (অনলাইন)</h1>
        <div id="room-badge" class="hidden bg-green-900/80 px-4 py-1.5 rounded-full text-sm font-semibold border border-green-600 shadow">
            রুম কোড: <span id="current-room-code" class="text-yellow-300 font-mono tracking-widest">------</span>
        </div>
    </header>

    <!-- Main Section -->
    <main class="flex-1 flex flex-col items-center justify-center p-4 relative">
        
        <!-- LOBBY SCREEN -->
        <div id="lobby-screen" class="w-full max-w-md bg-green-950/90 border border-green-700 p-8 rounded-3xl shadow-2xl backdrop-blur-md">
            <h2 class="text-2xl font-bold text-center text-yellow-400 mb-6">অনলাইন রুম তৈরি বা জয়েন করুন</h2>
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold mb-2 text-green-200">আপনার নাম:</label>
                    <input type="text" id="player-name" placeholder="নাম লিখুন..." class="w-full px-4 py-3 rounded-xl bg-black/50 border border-green-600 focus:outline-none focus:border-yellow-400 text-white font-medium">
                </div>
                <button onclick="createRoom()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3.5 rounded-xl shadow-lg transition transform active:scale-95">
                    নতুন রুম তৈরি করুন (Create Room)
                </button>
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-green-800"></div>
                    <span class="flex-shrink mx-4 text-gray-400 text-sm">অথবা</span>
                    <div class="flex-grow border-t border-green-800"></div>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="join-room-code" placeholder="রুম কোড দিন..." class="flex-1 px-4 py-3 rounded-xl bg-black/50 border border-green-600 uppercase focus:outline-none focus:border-yellow-400 text-white font-mono tracking-wider">
                    <button onclick="joinRoom()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-3 rounded-xl shadow-lg transition">
                        জয়েন
                    </button>
                </div>
            </div>
        </div>

        <!-- WAITING ROOM -->
        <div id="waiting-room" class="hidden w-full max-w-lg bg-green-950/90 border border-green-700 p-8 rounded-3xl shadow-2xl text-center backdrop-blur-md">
            <h2 class="text-2xl font-bold text-yellow-400 mb-2">খেলোয়াড়দের জন্য অপেক্ষা করা হচ্ছে...</h2>
            <p class="text-gray-300 text-sm mb-4">নিচের কোডটি আপনার বন্ধুদের শেয়ার দিন:</p>
            <div class="bg-black/60 p-4 rounded-2xl border border-yellow-500/50 mb-6 inline-block shadow-inner">
                <span id="display-room-code" class="text-4xl font-mono font-bold tracking-widest text-yellow-300">------</span>
            </div>
            <div id="players-list" class="space-y-2 mb-6 text-left bg-black/40 p-4 rounded-xl border border-green-800 text-sm min-h-[100px]"></div>
            <button id="start-btn" onclick="startGame()" class="hidden w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition">
                কার্ড শাফেল ও গেম শুরু করুন (Start Game)
            </button>
        </div>

        <!-- GAME TABLE -->
        <div id="game-table" class="hidden w-full max-w-6xl h-[740px] felt-table rounded-3xl border-4 border-green-900 relative flex flex-col justify-between p-6 overflow-hidden shadow-2xl">
            
            <!-- Top Player -->
            <div class="flex flex-col items-center">
                <div class="bg-black/60 px-4 py-1 rounded-full text-xs text-yellow-300 border border-green-700 mb-1">
                    <span id="top-name">পার্টনার</span>
                </div>
                <div id="top-hand" class="flex gap-1 h-16 items-center"></div>
            </div>

            <!-- Middle Field & Bidding/Partner Panel -->
            <div class="flex justify-between items-center px-12">
                <div class="flex flex-col items-center">
                    <div class="bg-black/60 px-4 py-1 rounded-full text-xs text-yellow-300 border border-green-700 mb-2">
                        <span id="left-name">বিরোধী ১</span>
                    </div>
                </div>

                <div class="flex flex-col items-center justify-center bg-black/40 p-6 rounded-3xl border border-green-700/60 min-w-[360px] shadow-2xl backdrop-blur-sm">
                    <div id="game-status" class="text-yellow-400 font-bold mb-3 text-lg text-center tracking-wide">বিড ডিক্লেয়ার করুন</div>
                    
                    <div id="trick-area" class="flex gap-3 h-32 items-center justify-center mb-3 min-w-[220px]"></div>
                    
                    <div id="action-panel" class="w-full flex flex-col items-center gap-2">
                        <div class="text-xs text-green-300 mb-1 font-semibold">বিড পয়েন্ট সিলেক্ট করুন:</div>
                        <div class="grid grid-cols-4 gap-2 mb-2 w-full">
                            <button onclick="makeBid(16)" class="bg-green-800 hover:bg-green-700 text-white font-bold py-1.5 rounded text-sm">১৬</button>
                            <button onclick="makeBid(18)" class="bg-green-800 hover:bg-green-700 text-white font-bold py-1.5 rounded text-sm">১৮</button>
                            <button onclick="makeBid(20)" class="bg-green-800 hover:bg-green-700 text-white font-bold py-1.5 rounded text-sm">২০</button>
                            <button onclick="makeBid(22)" class="bg-green-800 hover:bg-green-700 text-white font-bold py-1.5 rounded text-sm">২২</button>
                        </div>
                        <button onclick="passBid()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-2 rounded-xl shadow transition">পাস (Pass)</button>
                    </div>
                </div>

                <div class="flex flex-col items-center">
                    <div class="bg-black/60 px-4 py-1 rounded-full text-xs text-yellow-300 border border-green-700 mb-2">
                        <span id="right-name">বিরোধী ২</span>
                    </div>
                </div>
            </div>

            <!-- Current User Hand -->
            <div class="flex flex-col items-center">
                <div class="flex gap-2 mb-2" id="my-hand"></div>
                <div class="text-sm font-semibold text-green-200" id="my-name-label">আপনার হাত</div>
            </div>

        </div>

    </main>

    <script>
        // Free Open Public Firebase Connection Config
        const firebaseConfig = {
            databaseURL: "https://cards29-game-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myName = "", currentRoom = "", isHost = false;
        let myCards = [];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.08);
        }

        function createRoom() {
            myName = document.getElementById('player-name').value.trim();
            if(!myName) { alert("নাম লিখুন!"); return; }
            currentRoom = Math.random().toString(36).substring(2, 7).toUpperCase();
            isHost = true;

            db.ref('rooms/' + currentRoom).set({
                status: 'waiting',
                players: [{ name: myName, isHost: true }]
            });

            listenToRoom();
            showWaitingRoom();
        }

        function joinRoom() {
            myName = document.getElementById('player-name').value.trim();
            let code = document.getElementById('join-room-code').value.trim().toUpperCase();
            if(!myName || !code) { alert("নাম এবং কোড দিন!"); return; }
            currentRoom = code;

            db.ref('rooms/' + currentRoom).once('value', snapshot => {
                if(!snapshot.exists()) { alert("রুম পাওয়া যায়নি!"); return; }
                let room = snapshot.val();
                let players = room.players || [];
                if(players.length >= 4) { alert("রুম ফুল হয়ে গেছে!"); return; }

                players.push({ name: myName, isHost: false });
                db.ref('rooms/' + currentRoom + '/players').set(players);
                listenToRoom();
                showWaitingRoom();
            });
        }

        function showWaitingRoom() {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('waiting-room').classList.remove('hidden');
            document.getElementById('room-badge').classList.remove('hidden');
            document.getElementById('display-room-code').innerText = currentRoom;
            document.getElementById('current-room-code').innerText = currentRoom;
        }

        function listenToRoom() {
            db.ref('rooms/' + currentRoom).on('value', snapshot => {
                if(!snapshot.exists()) return;
                let room = snapshot.val();
                let players = room.players || [];

                // Update players list
                let html = '<div class="text-gray-400 font-semibold mb-2">যুক্ত হওয়া প্লেয়ারসমূহ:</div>';
                players.forEach(p => {
                    html += `<div class="text-green-300 font-bold py-1">👤 ${p.name} ${p.isHost ? '(হোস্ট)' : ''}</div>`;
                });
                document.getElementById('players-list').innerHTML = html;

                if(isHost && players.length === 4) {
                    document.getElementById('start-btn').classList.remove('hidden');
                }

                // If game started
                if(room.status === 'playing') {
                    document.getElementById('waiting-room').classList.add('hidden');
                    document.getElementById('game-table').classList.remove('hidden');
                    let pIndex = players.findIndex(p => p.name === myName);
                    if(room.hands && room.hands[pIndex]) {
                        myCards = room.hands[pIndex];
                        renderMyHand();
                    }
                }
            });
        }

        function startGame() {
            const suits = ['♠', '♥', '♦', '♣'];
            const ranks = ['J', '9', 'A', '10', 'K', 'Q', '8', '7'];
            let deck = [];
            suits.forEach(s => ranks.forEach(r => deck.push({ suit: s, rank: r, color: (s === '♥' || s === '♦') ? 'text-red-500' : 'text-black' })));
            deck.sort(() => Math.random() - 0.5);

            let hands = [
                deck.slice(0, 8),
                deck.slice(8, 16),
                deck.slice(16, 24),
                deck.slice(24, 32)
            ];

            db.ref('rooms/' + currentRoom).update({
                status: 'playing',
                hands: hands
            });
        }

        function renderMyHand() {
            playSound('deal');
            const myHandEl = document.getElementById('my-hand');
            myHandEl.innerHTML = '';
            myCards.forEach(c => {
                let cardDiv = document.createElement('div');
                cardDiv.className = `card bg-white w-16 h-24 rounded-lg shadow-2xl flex flex-col justify-between p-2 cursor-pointer border ${c.color} font-bold`;
                cardDiv.innerHTML = `<span class="text-sm">${c.rank}</span><span class="text-xl self-center">${c.suit}</span><span class="text-sm self-end rotate-180">${c.rank}</span>`;
                cardDiv.onclick = () => { cardDiv.remove(); document.getElementById('trick-area').appendChild(cardDiv); };
                myHandEl.appendChild(cardDiv);
            });
        }

        function makeBid(val) {
            playSound('deal');
            document.getElementById('game-status').innerText = `বিড করেছেন: ${val} পয়েন্ট। এখন পার্টনার সিলেক্ট করুন:`;
            document.getElementById('action-panel').innerHTML = `
                <div class="text-xs text-yellow-300 mb-1 font-semibold">কোন কার্ডটি আপনার পার্টনারের হাতে থাকবে?</div>
                <div class="grid grid-cols-4 gap-2 w-full">
                    <button onclick="selectPartner('♠ J', 'ইস্কাপন জেক')" class="bg-black text-white py-1.5 rounded text-xs font-bold">♠ J</button>
                    <button onclick="selectPartner('♥ J', 'হার্ট জেক')" class="bg-red-600 text-white py-1.5 rounded text-xs font-bold">♥ J</button>
                    <button onclick="selectPartner('♦ J', 'রুইত জেক')" class="bg-red-600 text-white py-1.5 rounded text-xs font-bold">♦ J</button>
                    <button onclick="selectPartner('♣ J', 'চিড়িয়া জেক')" class="bg-black text-white py-1.5 rounded text-xs font-bold">♣ J</button>
                </div>
            `;
        }

        function selectPartner(cardCode, cardName) {
            playSound('deal');
            document.getElementById('game-status').innerText = `পার্টনার সিলেক্ট হয়েছে: ${cardName} (${cardCode})!`;
            document.getElementById('action-panel').innerHTML = `<span class="text-xs text-green-300">আপনার কার্ড থেকে খেলুন...</span>`;
        }

        function passBid() {
            playSound('deal');
            document.getElementById('game-status').innerText = `আপনি পাস করেছেন।`;
            document.getElementById('action-panel').innerHTML = `<span class="text-xs text-gray-400">অন্যদের পালা...</span>`;
        }
    </script>
</body>
</html>
